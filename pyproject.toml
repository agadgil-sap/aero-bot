[build-system]
# Hatchling provides a small, standards-based wheel build backend.
requires = ["hatchling>=1.27,<2"]
# The PEP 517 backend used to build source and wheel distributions.
build-backend = "hatchling.build"

[project]
# The distribution name used by package installers.
name = "aero-bot"
# The initial pre-release version while the wallet-free product is assembled.
version = "0.1.0"
# A concise package summary for local installation metadata.
description = "A safe, wallet-free local Aerodrome LP analysis application"
# The repository README supplies long-form package metadata.
readme = "README.md"
# Python 3.12 is the oldest runtime supported by the application.
requires-python = ">=3.12"
# Runtime dependencies are bounded to compatible major versions.
dependencies = [
  "eth-account>=0.13,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pycryptodome>=3.23,<4",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
# Development tools provide tests, linting, formatting, and static type checks.
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
# The local command starts the loopback-only ASGI server.
aero-bot = "aero_bot.__main__:main"
# The rehearsal command replays the policy over reconstructed onchain history.
aero-bot-rehearse = "aero_bot.rehearse:main"
# The swap command manually executes one hard-capped Safe swap on Base.
aero-bot-swap = "aero_bot.executor:main"
# The LP command manually plans and validates hard-capped Safe LP lifecycle
# transactions on Base; this release never broadcasts.
aero-bot-lp = "aero_bot.lp_executor:main"
# The decision command runs one complete policy verdict from live reads;
# decision-only - nothing is built, signed, or broadcast.
aero-bot-decide = "aero_bot.strategy:main"
# The cycle command runs one scheduled reconcile-decide-act cycle; the
# systemd timer decides when cycles run, and every broadcast flows through
# the audited capped executor surfaces.
aero-bot-cycle = "aero_bot.cycle:main"
# The backup command verifies, encrypts, and pushes the audit chain to a
# private git branch through a deploy key once per day.
aero-bot-audit-backup = "aero_bot.audit_backup:main"
# The watchtower command runs the always-on range watcher: one cheap tick
# poll every few seconds and the audited defensive close on a verified
# range trip; dark until the sealed enable flag arms it.
aero-bot-watchtower = "aero_bot.watchtower:main"
# The advisor command runs the shadow intelligence pass: it composes the
# audited factual picture and requests one bounded brief; advisory only,
# fail-closed, and dark until the sealed plane values arm it.
aero-bot-advisor = "aero_bot.advisor:main"
# The teacher command runs the Mac-side advisory seats over a read-only
# window pulled from the production box; schema-validated briefs land in the
# local corpus, one episode per pass, advisory only.
aero-bot-teacher = "aero_bot.teacher:main"

[tool.hatch.build.targets.wheel]
# The wheel contains only the application package under the src layout.
packages = ["src/aero_bot"]

[tool.pytest.ini_options]
# Pytest imports the installed src-layout package and reports terse failures.
addopts = "--strict-config --strict-markers -ra"
# Tests live in the repository's dedicated behavior-test directory.
testpaths = ["tests"]

[tool.coverage.run]
# Branch coverage ensures both sides of security decisions are exercised.
branch = true
# Coverage is limited to first-party application modules.
source = ["aero_bot"]

[tool.coverage.report]
# Missing line numbers make incomplete behavior coverage actionable.
show_missing = true
# Initial coverage must remain high as the application grows.
fail_under = 90

[tool.ruff]
# Source and tests share a clear, review-friendly line length.
line-length = 100
# Ruff analyzes code supported by the minimum Python runtime.
target-version = "py312"
# Campaign evidence under data/ preserves verbatim scratch drivers and is
# not shipped source.
exclude = ["data"]

[tool.ruff.lint]
# The selected rules cover correctness, imports, security, annotations, and docs.
select = ["A", "ANN", "B", "C4", "D", "E", "F", "I", "N", "S", "SIM", "UP"]
# Package module docstrings add noise without improving the public API.
ignore = ["D104"]

[tool.ruff.lint.per-file-ignores]
# Test functions use pytest assertions and need no return annotations beyond None.
"tests/**/*.py" = ["S101", "S104"]
# Risk fixtures use public contract addresses that security lint misclassifies as secrets.
"tests/test_risk.py" = ["S105", "S106"]
# Policy fixtures use public contract addresses that security lint misclassifies as secrets.
"tests/test_policy.py" = ["S105", "S106"]
# The backup tests drive the real git binary through its absolute path with
# test-controlled arguments against throwaway local bare remotes.
"tests/test_audit_backup.py" = ["S603"]

[tool.ruff.lint.pydocstyle]
# Google-style docstrings are readable in source and generated documentation.
convention = "google"

[tool.mypy]
# Strict mode prevents accidental Any values from entering risk decisions later.
strict = true
# Mypy interprets code using the minimum supported Python language level.
python_version = "3.12"
# Error messages identify exact columns for faster diagnosis.
show_column_numbers = true
